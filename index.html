    const INITIAL_SETTINGS = {

    // --- ICON HELPER COMPONENTS (All SVGs wrapped properly inside single root elements) ---

    // --- MAIN APP COMPONENT ---
    function App() {
      // Local state management with fallback to LocalStorage
      const [categories, setCategories] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_categories');
          return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
        } catch(e) {
          return INITIAL_CATEGORIES;
        }
      });

      const [portfolio, setPortfolio] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_portfolio');
          return saved ? JSON.parse(saved) : INITIAL_PORTFOLIO;
        } catch(e) {
          return INITIAL_PORTFOLIO;
        }
      });

      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_settings');
          return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
        } catch(e) {
          return INITIAL_SETTINGS;
        }
      });

      // App Mode & Auth State
      const [viewMode, setViewMode] = useState('public'); // 'public' or 'admin'
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [activeAdminTab, setActiveAdminTab] = useState('dashboard');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('all');
      const [selectedArrangement, setSelectedArrangement] = useState(null); // Detail modal
      const [searchQuery, setSearchQuery] = useState('');

      // Notifications
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Persist changes to LocalStorage
      useEffect(() => {
        localStorage.setItem('floral_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('floral_portfolio', JSON.stringify(portfolio));
      }, [portfolio]);

      useEffect(() => {
        localStorage.setItem('floral_settings', JSON.stringify(settings));
      }, [settings]);

      // Computed published portfolio
      const publishedPortfolio = useMemo(() => {
        return portfolio.filter(item => item.publication_status === 'published');
      }, [portfolio]);

      // Filtered public portfolio
      const filteredPortfolio = useMemo(() => {
        return publishedPortfolio.filter(item => {
          const matchesCategory = selectedCategoryFilter === 'all' || item.category_id === selectedCategoryFilter;
          const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                item.flower_types.some(f => f.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCategory && matchesSearch;
        }).sort((a, b) => a.display_order - b.display_order);
      }, [publishedPortfolio, selectedCategoryFilter, searchQuery]);

      // Featured Collection items
      const featuredPortfolio = useMemo(() => {
        return publishedPortfolio
          .filter(item => item.is_featured)
          .sort((a, b) => (a.featured_order || 99) - (b.featured_order || 99));
      }, [publishedPortfolio]);

      return (
        <div className="min-h-screen flex flex-col selection:bg-duck-teal selection:text-white">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-md shadow-2xl flex items-center space-x-3 transition-all duration-300 ${toast.type === 'error' ? 'bg-red-900 text-white' : 'bg-deep-teal text-cream-white border border-duck-teal'}`}>
              <Icon name={toast.type === 'error' ? 'x' : 'check'} className="w-5 h-5 text-sage-green" />
              <span className="text-sm font-medium tracking-wide">{toast.message}</span>
            </div>
          )}

          {/* VIEW SWITCHER / HEADER BANNER */}
          {viewMode === 'public' ? (
            <PublicWebsite 
              settings={settings}
              categories={categories.filter(c => c.is_active).sort((a,b) => a.display_order - b.display_order)}
              portfolio={filteredPortfolio}
              featuredPortfolio={featuredPortfolio}
              selectedCategoryFilter={selectedCategoryFilter}
              setSelectedCategoryFilter={setSelectedCategoryFilter}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              onSelectArrangement={setSelectedArrangement}
              onOpenAdmin={() => setViewMode('admin')}
            />
          ) : (
            <AdminDashboard 
              isAuthenticated={isAdminAuthenticated}
              setIsAuthenticated={setIsAdminAuthenticated}
              activeTab={activeAdminTab}
              setActiveTab={setActiveAdminTab}
              categories={categories}
              setCategories={setCategories}
              portfolio={portfolio}
              setPortfolio={setPortfolio}
              settings={settings}
              setSettings={setSettings}
              onReturnToPublic={() => setViewMode('public')}
              showToast={showToast}
            />
          )}

          {/* PORTFOLIO DETAIL MODAL */}
          {selectedArrangement && (
            <ArrangementDetailModal 
              item={selectedArrangement} 
              categoryName={categories.find(c => c.id === selectedArrangement.category_id)?.name || 'Collection'}
              settings={settings}
              onClose={() => setSelectedArrangement(null)} 
            />
          )}

          {/* FLOATING WHATSAPP CTA FOR PUBLIC VIEW */}
          {viewMode === 'public' && (
            <a 
              href={`https://wa.me/${settings.whatsapp_number}?text=${encodeURIComponent(settings.whatsapp_default_message)}`}
              target="_blank" 
              rel="noopener noreferrer"
              className="fixed bottom-6 right-6 z-40 bg-duck-teal hover:bg-deep-teal text-white p-4 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center border border-sage-green/30 group"
              title="Chat on WhatsApp"
            >
              <Icon name="whatsapp" className="w-6 h-6 text-cream-white" />
              <span className="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-500 ease-in-out text-xs font-semibold tracking-wider uppercase pl-0 group-hover:pl-2">
                Enquire via WhatsApp
              </span>
            </a>
          )}
        </div>
      );
    }

    // ==========================================
    // 1. PUBLIC WEBSITE COMPONENT
    // ==========================================
    function PublicWebsite({ 
      settings, 
      categories, 
      portfolio, 
      featuredPortfolio,

    // --- ADMIN SUB-TAB 2: PORTFOLIO MANAGER ---

      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      // Form fields
      const [title, setTitle] = useState('');
      const [categoryId, setCategoryId] = useState(categories[0]?.id || '');
      const [price, setPrice] = useState(250);
      const [showPrice, setShowPrice] = useState(true);
      const [flowerTypes, setFlowerTypes] = useState('');
      const [floralMessage, setFloralMessage] = useState('');
      const [description, setDescription] = useState('');
      const [imageUrl, setImageUrl] = useState('');
      const [isFeatured, setIsFeatured] = useState(false);

      const handleOpenCreate = () => {
        setEditingItem(null);
        setTitle('');
        setCategoryId(categories[0]?.id || '');
        setPrice(250);
        setShowPrice(true);
        setFlowerTypes('Roses, Hydrangea, Eucalyptus');
        setFloralMessage('A charming blend of romance and elegance.');
        setDescription('Handcrafted arrangement made with premium flowers.');
        setImageUrl('https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=1000&q=80');
        setIsFeatured(false);
        setIsModalOpen(true);
      };

      const handleOpenEdit = (item) => {
        setEditingItem(item);
        setTitle(item.title);
        setCategoryId(item.category_id);
        setPrice(item.price);
        setShowPrice(item.show_price);
        setFlowerTypes(item.flower_types.join(', '));
        setFloralMessage(item.floral_message);
        setDescription(item.description);
        setImageUrl(item.main_image);
        setIsFeatured(item.is_featured);
        setIsModalOpen(true);
      };

      const handleSave = (e) => {
        e.preventDefault();
        const flowerArray = flowerTypes.split(',').map(s => s.trim()).filter(Boolean);

        if (editingItem) {
          // Update
          setPortfolio(prev => prev.map(p => p.id === editingItem.id ? {
            ...p,
            title,
            category_id: categoryId,
            price: Number(price),
            show_price: showPrice,
            flower_types: flowerArray,
            floral_message: floralMessage,
            description,
            main_image: imageUrl,
            processed_image: imageUrl === p.main_image ? p.processed_image : imageUrl,
            is_featured: isFeatured
          } : p));
          showToast(`Updated "${title}"`);
        } else {
          // Create
          const newItem = {
            id: `pf-${Date.now()}`,
            category_id: categoryId,
            title,
            slug: title.toLowerCase().replace(/\s+/g, '-'),
            price: Number(price),
            show_price: showPrice,
            flower_types: flowerArray,
            floral_message: floralMessage,
            description,
            is_featured: isFeatured,
            featured_order: portfolio.length + 1,
            display_order: portfolio.length + 1,
            publication_status: 'published',
            main_image: imageUrl,
            processed_image: imageUrl,
            additional_images: [],
            created_at: new Date().toISOString()
          };
          setPortfolio(prev => [newItem, ...prev]);
          showToast(`Created new floral arrangement "${title}"`);
        }
        setIsModalOpen(false);
      };

      const handleDelete = (id, itemTitle) => {
        if (confirm(`Are you sure you want to delete "${itemTitle}"?`)) {
          setPortfolio(prev => prev.filter(p => p.id !== id));
          showToast(`Deleted "${itemTitle}"`);
        }
      };

      const toggleStatus = (id) => {
        setPortfolio(prev => prev.map(p => p.id === id ? {
          ...p,
          publication_status: p.publication_status === 'published' ? 'draft' : 'published'
        } : p));
        showToast('Publication status toggled');

        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="font-serif text-3xl text-deep-teal">Portfolio Management</h1>

            </div>
            <button 
              onClick={handleOpenCreate}
              className="px-5 py-2.5 bg-duck-teal text-cream-white text-xs uppercase tracking-widest font-semibold rounded hover:bg-deep-teal transition-colors shadow-md flex items-center space-x-2"
            >
              <Icon name="plus" className="w-4 h-4" />
              <span>Add New Item</span>
            </button>
          </div>

          <div className="bg-cream-white rounded-lg shadow-sm border border-sage-green/30 overflow-hidden">
            <table className="w-full text-left text-xs border-collapse">
              <thead>
                <tr className="bg-soft-cream border-b border-sage-green/30 text-deep-teal uppercase tracking-wider font-semibold">
                  <th className="p-4">Arrangement</th>
                  <th className="p-4">Category</th>
                  <th className="p-4">Price (RM)</th>
                  <th className="p-4">Status</th>
                  <th className="p-4 text-right">Actions</th>

              </thead>
              <tbody className="divide-y divide-sage-green/20">
                {portfolio.map(item => {
                  const cat = categories.find(c => c.id === item.category_id);
                  return (
                    <tr key={item.id} className="hover:bg-soft-cream/40 transition-colors">
                      <td className="p-4 flex items-center space-x-3">
                        <img src={item.main_image} className="w-10 h-12 object-cover rounded bg-soft-cream" />
                        <div>
                          <p className="font-semibold text-deep-teal">{item.title}</p>
                          <p className="text-[10px] text-dark-grey/60">{item.flower_types.join(', ')}</p>
                        </div>
                      </td>
                      <td className="p-4 text-dark-grey font-medium">{cat?.name || 'Unassigned'}</td>
                      <td className="p-4 font-mono font-semibold text-duck-teal">RM {item.price}</td>
                      <td className="p-4">
                        <button 
                          onClick={() => toggleStatus(item.id)}
                          className={`px-3 py-1 rounded-full text-[10px] uppercase tracking-wider font-semibold ${item.publication_status === 'published' ? 'bg-sage-green/30 text-deep-teal' : 'bg-gray-200 text-gray-700'}`}
                        >

                      <td className="p-4 text-right space-x-2">
                        <button onClick={() => handleOpenEdit(item)} className="p-1.5 hover:bg-sage-green/20 rounded text-duck-teal" title="Edit">

                        </button>
                      </td>
                    </tr>
                  );

            </table>
          </div>

          {/* EDIT / ADD MODAL */}
          {isModalOpen && (

              <div className="bg-cream-white max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 rounded-lg shadow-2xl border border-sage-green/30 space-y-6">
                <div className="flex justify-between items-center border-b border-sage-green/30 pb-4">
                  <h2 className="font-serif text-2xl text-deep-teal">
                    {editingItem ? 'Edit Portfolio Item' : 'Add New Portfolio Item'}
                  </h2>
                  <button onClick={() => setIsModalOpen(false)}><Icon name="x" className="w-5 h-5 text-dark-grey" /></button>

                <form onSubmit={handleSave} className="space-y-4 text-xs">

                    <label className="block font-semibold text-deep-teal uppercase mb-1">Arrangement Title</label>

                      type="text"

                      value={title} 
                      onChange={e => setTitle(e.target.value)}

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block font-semibold text-deep-teal uppercase mb-1">Category</label>
                      <select 
                        value={categoryId} 
                        onChange={e => setCategoryId(e.target.value)}
                        className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded"
                      >
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}

                    <div>
                      <label className="block font-semibold text-deep-teal uppercase mb-1">Price (RM)</label>
                      <input 
                        type="number" 
                        required 
                        value={price} 
                        onChange={e => setPrice(e.target.value)} 
                        className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded"
                      />
                    </div>
                  </div>

                  <div className="flex items-center space-x-4">
                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={showPrice} onChange={e => setShowPrice(e.target.checked)} />
                      <span>Display Price Publicly</span>

                    <label className="flex items-center space-x-2 cursor-pointer">
                      <input type="checkbox" checked={isFeatured} onChange={e => setIsFeatured(e.target.checked)} />
                      <span>Highlight as Featured Masterpiece</span>

                  <div>
                    <label className="block font-semibold text-deep-teal uppercase mb-1">Flower Types (Comma Separated)</label>
                    <input 
                      type="text" 
                      value={flowerTypes} 
                      onChange={e => setFlowerTypes(e.target.value)} 
                      className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-deep-teal uppercase mb-1">Floral Poetic Message</label>
                    <input 
                      type="text" 
                      value={floralMessage} 
                      onChange={e => setFloralMessage(e.target.value)} 
                      className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded"
                    />

                  <div>
                    <label className="block font-semibold text-deep-teal uppercase mb-1">Detailed Description</label>

                  <div>
                    <label className="block font-semibold text-deep-teal uppercase mb-1">Image URL</label>
                    <input 
                      type="url"

                  <div className="pt-4 flex justify-end space-x-3">

                    <button type="submit" className="px-6 py-2.5 bg-duck-teal text-cream-white rounded uppercase tracking-wider font-semibold">Save Arrangement</button>

    // --- ADMIN SUB-TAB 3: CATEGORY MANAGER ---
    function AdminCategoryManager({ categories, setCategories, showToast }) {
      const [newCategoryName, setNewCategoryName] = useState('');

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newCategoryName) return;
        const newCat = {
          id: `cat-${Date.now()}`,
          name: newCategoryName,
          slug: newCategoryName.toLowerCase().replace(/\s+/g, '-'),
          description: 'Custom botanical collection',
          display_order: categories.length + 1,
          is_active: true
        };
        setCategories(prev => [...prev, newCat]);
        setNewCategoryName('');
        showToast(`Added category "${newCategoryName}"`);
      };

      const moveCategory = (index, direction) => {
        const newArr = [...categories];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= newArr.length) return;
        
        // Swap
        const temp = newArr[index];
        newArr[index] = newArr[targetIndex];
        newArr[targetIndex] = temp;

        // Update display order field
        const reordered = newArr.map((item, idx) => ({ ...item, display_order: idx + 1 }));
        setCategories(reordered);
        showToast('Category sequence updated.');
      };

      const handleDelete = (id, name) => {
        if (confirm(`Delete category "${name}"?`)) {
          setCategories(prev => prev.filter(c => c.id !== id));
          showToast(`Deleted "${name}"`);
        }
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Category Management</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Reorder, create, or disable categories. Category order updates the public homepage dynamically.</p>
          </div>

          {/* ADD CATEGORY FORM */}
          <form onSubmit={handleAddCategory} className="bg-cream-white p-4 rounded-lg shadow-sm border border-sage-green/30 flex gap-3">
            <input 
              type="text" 
              placeholder="New Category Name (e.g., Seasonal Collection)" 
              value={newCategoryName} 
              onChange={e => setNewCategoryName(e.target.value)} 
              className="flex-1 bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs"
            />
            <button type="submit" className="px-5 py-2.5 bg-duck-teal text-cream-white text-xs uppercase tracking-widest font-semibold rounded">
              Add Category
            </button>
          </form>

          {/* LIST OF CATEGORIES */}
          <div className="bg-cream-white rounded-lg shadow-sm border border-sage-green/30 divide-y divide-sage-green/20">
            {categories.map((cat, index) => (
              <div key={cat.id} className="p-4 flex items-center justify-between hover:bg-soft-cream/30 transition-colors text-xs">
                <div className="flex items-center space-x-4">
                  <span className="w-6 h-6 rounded-full bg-duck-teal/10 text-duck-teal font-semibold flex items-center justify-center text-[11px]">
                    {index + 1}
                  </span>
                  <div>
                    <p className="font-semibold text-deep-teal">{cat.name}</p>
                    <p className="text-[10px] text-dark-grey/60">/collections/{cat.slug}</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2">
                  <button 
                    disabled={index === 0} 
                    onClick={() => moveCategory(index, -1)}
                    className="p-1.5 border border-sage-green/40 rounded hover:bg-sage-green/20 disabled:opacity-30"
                    title="Move Up"
                  >
                    <Icon name="arrowUp" className="w-4 h-4 text-deep-teal" />
                  </button>
                  <button 
                    disabled={index === categories.length - 1} 
                    onClick={() => moveCategory(index, 1)}
                    className="p-1.5 border border-sage-green/40 rounded hover:bg-sage-green/20 disabled:opacity-30"
                    title="Move Down"
                  >
                    <Icon name="arrowDown" className="w-4 h-4 text-deep-teal" />
                  </button>
                  <button 
                    onClick={() => handleDelete(cat.id, cat.name)}
                    className="p-1.5 border border-red-200 text-red-700 rounded hover:bg-red-50"
                  >
                    <Icon name="trash" className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 4: PORTFOLIO SORTING MANAGER ---
    function AdminSortingManager({ categories, portfolio, setPortfolio, showToast }) {
      const [selectedCatId, setSelectedCatId] = useState(categories[0]?.id || '');

      const itemsInCategory = portfolio
        .filter(p => p.category_id === selectedCatId)
        .sort((a,b) => a.display_order - b.display_order);

      const moveItem = (index, direction) => {
        const newArr = [...itemsInCategory];
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= newArr.length) return;

        // Swap
        const temp = newArr[index];
        newArr[index] = newArr[targetIndex];
        newArr[targetIndex] = temp;

        // Update display_order inside global state
        const updatedIdsMap = new Map(newArr.map((item, idx) => [item.id, idx + 1]));

        setPortfolio(prev => prev.map(p => {
          if (updatedIdsMap.has(p.id)) {
            return { ...p, display_order: updatedIdsMap.get(p.id) };
          }
          return p;
        }));

        showToast('Arrangement sorting order saved.');
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Arrangement Order Within Category</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Select a category and adjust the display position of each arrangement independently.</p>
          </div>

          <div className="bg-cream-white p-4 rounded-lg shadow-sm border border-sage-green/30">
            <label className="block text-xs font-semibold uppercase text-deep-teal mb-2">Select Category to Reorder</label>
            <select 
              value={selectedCatId} 
              onChange={e => setSelectedCatId(e.target.value)} 
              className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs"
            >
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>

          <div className="bg-cream-white rounded-lg shadow-sm border border-sage-green/30 divide-y divide-sage-green/20">
            {itemsInCategory.length === 0 ? (
              <p className="p-6 text-xs text-dark-grey/60 text-center">No items found in this category.</p>
            ) : (
              itemsInCategory.map((item, index) => (
                <div key={item.id} className="p-4 flex items-center justify-between text-xs">
                  <div className="flex items-center space-x-3">
                    <span className="font-mono text-xs text-duck-teal font-semibold w-5">{index + 1}.</span>
                    <img src={item.main_image} className="w-8 h-10 object-cover rounded bg-soft-cream" />
                    <div>
                      <p className="font-semibold text-deep-teal">{item.title}</p>
                      <p className="text-[10px] text-dark-grey/60">RM {item.price}</p>
                    </div>
                  </div>

                  <div className="flex space-x-2">
                    <button 
                      disabled={index === 0} 
                      onClick={() => moveItem(index, -1)} 
                      className="p-1.5 border border-sage-green/40 rounded hover:bg-sage-green/20 disabled:opacity-30"
                    >
                      <Icon name="arrowUp" className="w-4 h-4 text-deep-teal" />
                    </button>
                    <button 
                      disabled={index === itemsInCategory.length - 1} 
                      onClick={() => moveItem(index, 1)} 
                      className="p-1.5 border border-sage-green/40 rounded hover:bg-sage-green/20 disabled:opacity-30"
                    >
                      <Icon name="arrowDown" className="w-4 h-4 text-deep-teal" />
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

                <div 
                  key={item.id} 
                  className={`p-4 rounded-lg border flex items-center justify-between text-xs transition-all ${item.is_featured ? 'border-duck-teal bg-duck-teal/5' : 'border-sage-green/30 bg-soft-cream/30'}`}
                >
                  <div className="flex items-center space-x-3">
                    <img src={item.main_image} className="w-10 h-12 object-cover rounded bg-soft-cream" />
                    <div>
                      <p className="font-semibold text-deep-teal">{item.title}</p>
                      <p className="text-[10px] font-mono text-duck-teal">RM {item.price}</p>
                    </div>
                  </div>
                  <button 
                    onClick={() => toggleFeatured(item.id)}
                    className={`px-3 py-1.5 rounded uppercase tracking-wider text-[10px] font-semibold transition-colors ${item.is_featured ? 'bg-duck-teal text-cream-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                  >
                    {item.is_featured ? 'Featured' : 'Add to Featured'}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 6: AI BACKGROUND REMOVAL WORKER ---
    function AdminAIBackgroundRemoval({ portfolio, setPortfolio, showToast }) {
      const [selectedItemId, setSelectedItemId] = useState(portfolio[0]?.id || '');
      const [isProcessing, setIsProcessing] = useState(false);
      const [previewTransparentUrl, setPreviewTransparentUrl] = useState(null);

      const currentItem = portfolio.find(p => p.id === selectedItemId);

      // Automated AI Processing Pipeline Simulation
      const handleTriggerBgRemoval = () => {
        if (!currentItem) return;
        setIsProcessing(true);
        setPreviewTransparentUrl(null);

        // Simulate cloud AI worker delay
        setTimeout(() => {
          const transparentPngSample = currentItem.main_image; 
          setPreviewTransparentUrl(transparentPngSample);
          setIsProcessing(false);

          // Update portfolio item
          setPortfolio(prev => prev.map(p => p.id === currentItem.id ? {
            ...p,
            processed_image: transparentPngSample
          } : p));

          showToast('AI Background Removal completed! Transparent PNG stored in cloud.');
        }, 2200);
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <div className="flex items-center space-x-2">
              <Icon name="sparkles" className="w-6 h-6 text-duck-teal" />
              <h1 className="font-serif text-3xl text-deep-teal">AI Background Removal Worker</h1>
            </div>
            <p className="text-xs text-dark-grey/70 mt-1">Extract floral arrangements cleanly from photographic backdrops to generate transparent PNG assets.</p>
          </div>

          <div className="bg-cream-white p-6 rounded-lg shadow-sm border border-sage-green/30 space-y-6">
            <div>
              <label className="block text-xs font-semibold uppercase text-deep-teal mb-2">Select Item to Process</label>
              <select 
                value={selectedItemId} 
                onChange={e => { setSelectedItemId(e.target.value); setPreviewTransparentUrl(null); }} 
                className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs"
              >
                {portfolio.map(p => <option key={p.id} value={p.id}>{p.title}</option>)}
              </select>
            </div>

            {currentItem && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {/* Original Photo */}
                <div className="space-y-2">
                  <span className="text-xs font-semibold uppercase text-dark-grey">Original Photo</span>
                  <div className="aspect-[4/5] bg-soft-cream rounded overflow-hidden border border-sage-green/30">
                    <img src={currentItem.main_image} className="w-full h-full object-cover" />
                  </div>
                </div>

                {/* AI Transparent PNG Result */}
                <div className="space-y-2">
                  <span className="text-xs font-semibold uppercase text-dark-grey">AI Transparent PNG Output</span>
                  <div className="aspect-[4/5] bg-checkerboard rounded overflow-hidden border border-sage-green/30 flex items-center justify-center relative">
                    {isProcessing ? (
                      <div className="text-center p-6 space-y-3">
                        <Icon name="refresh" className="w-8 h-8 text-duck-teal animate-spin mx-auto" />
                        <p className="text-xs font-semibold text-deep-teal uppercase tracking-widest">Removing Background...</p>
                        <p className="text-[10px] text-dark-grey/60">Isolating leaves, petals and wrapping paper...</p>
                      </div>
                    ) : currentItem.processed_image ? (
                      <img src={currentItem.processed_image} className="w-full h-full object-contain" />
                    ) : (
                      <p className="text-xs text-dark-grey/50 p-6 text-center">Click process to initiate background removal.</p>
                    )}
                  </div>
                </div>
              </div>
            )}

            <button 
              disabled={isProcessing}
              onClick={handleTriggerBgRemoval}
              className="w-full py-3 bg-duck-teal hover:bg-deep-teal text-cream-white text-xs uppercase tracking-widest font-semibold rounded shadow-md transition-colors flex items-center justify-center space-x-2 disabled:opacity-50"
            >
              <Icon name="sparkles" className="w-4 h-4 text-sage-green" />
              <span>{isProcessing ? 'Processing in Cloud Worker...' : 'Execute AI Background Removal'}</span>
            </button>
          </div>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 7: APPEARANCE SETTINGS ---
    function AdminAppearanceSettings({ settings, setSettings, showToast }) {
      const [formData, setFormData] = useState(settings);

      const handleSubmit = (e) => {
        e.preventDefault();
        setSettings(formData);
        showToast('Website appearance settings saved.');
      };

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Website Appearance & Brand Settings</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Customize your brand identity, hero message, social contacts, and section visibility.</p>
          </div>

          <form onSubmit={handleSubmit} className="bg-cream-white p-8 rounded-lg shadow-sm border border-sage-green/30 space-y-6 text-xs">
            <div className="space-y-4">
              <h3 className="font-serif text-xl text-deep-teal border-b border-sage-green/20 pb-2">Brand Identity</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold uppercase text-dark-grey mb-1">Brand Name</label>
                  <input type="text" value={formData.brand_name} onChange={e => setFormData({...formData, brand_name: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded" />
                </div>
                <div>
                  <label className="block font-semibold uppercase text-dark-grey mb-1">Tagline</label>
                  <input type="text" value={formData.brand_tagline} onChange={e => setFormData({...formData, brand_tagline: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded" />
                </div>
              </div>
            </div>

            <div className="space-y-4">
              <h3 className="font-serif text-xl text-deep-teal border-b border-sage-green/20 pb-2">Hero Section Content</h3>
              <div>
                <label className="block font-semibold uppercase text-dark-grey mb-1">Hero Title</label>
                <input type="text" value={formData.hero_title} onChange={e => setFormData({...formData, hero_title: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded" />
              </div>
              <div>
                <label className="block font-semibold uppercase text-dark-grey mb-1">Hero Subtitle</label>
                <textarea rows={2} value={formData.hero_subtitle} onChange={e => setFormData({...formData, hero_subtitle: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded"></textarea>
              </div>
              <div>
                <label className="block font-semibold uppercase text-dark-grey mb-1">Hero Backdrop Image URL</label>
                <input type="url" value={formData.hero_image} onChange={e => setFormData({...formData, hero_image: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded" />
              </div>
            </div>

            <div className="space-y-4">
              <h3 className="font-serif text-xl text-deep-teal border-b border-sage-green/20 pb-2">WhatsApp Concierge</h3>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block font-semibold uppercase text-dark-grey mb-1">WhatsApp Number (International Format)</label>
                  <input type="text" value={formData.whatsapp_number} onChange={e => setFormData({...formData, whatsapp_number: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded" />
                </div>
                <div>
                  <label className="block font-semibold uppercase text-dark-grey mb-1">Default Inbound Message</label>
                  <input type="text" value={formData.whatsapp_default_message} onChange={e => setFormData({...formData, whatsapp_default_message: e.target.value})} className="w-full bg-soft-cream border p-2.5 rounded" />
                </div>
              </div>
            </div>

            <div className="pt-4 flex justify-end">
              <button type="submit" className="px-8 py-3 bg-duck-teal text-cream-white text-xs uppercase tracking-widest font-semibold rounded shadow-md">
                Save All Changes
              </button>
            </div>
          </form>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 8: DATABASE & GITHUB DEPLOYMENT ---
    function AdminDatabaseGuide() {
      const sqlSchema = `-- ==========================================
-- LUXURY FLORAL PORTFOLIO DATABASE SCHEMA
-- PostgreSQL / Supabase
-- ==========================================

-- Enable UUID extension
CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- 1. CATEGORIES TABLE
CREATE TABLE IF NOT EXISTS public.categories (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    name VARCHAR(255) NOT NULL,
    slug VARCHAR(255) NOT NULL UNIQUE,
    description TEXT,
    display_order INT DEFAULT 0,
    is_active BOOLEAN DEFAULT true,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- 2. PORTFOLIO ITEMS TABLE
CREATE TABLE IF NOT EXISTS public.portfolio_items (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    category_id UUID REFERENCES public.categories(id) ON DELETE SET NULL,
    title VARCHAR(255) NOT NULL,
    slug VARCHAR(255) NOT NULL UNIQUE,
    price DECIMAL(10,2) NOT NULL,
    show_price BOOLEAN DEFAULT true,
    flower_types TEXT[] DEFAULT '{}',
    floral_message TEXT,
    description TEXT,
    is_featured BOOLEAN DEFAULT false,
    featured_order INT DEFAULT 0,
    display_order INT DEFAULT 0,
    publication_status VARCHAR(50) DEFAULT 'published',
    main_image TEXT NOT NULL,
    processed_image TEXT,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- ROW LEVEL SECURITY (RLS) POLICIES
ALTER TABLE public.categories ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.portfolio_items ENABLE ROW LEVEL SECURITY;

-- Public Visitors: READ ONLY
CREATE POLICY "Public Read Categories" ON public.categories FOR SELECT USING (is_active = true);
CREATE POLICY "Public Read Portfolio" ON public.portfolio_items FOR SELECT USING (publication_status = 'published');

-- Authorized Admins: FULL ACCESS
CREATE POLICY "Admin Full Categories" ON public.categories FOR ALL USING (auth.role() = 'authenticated');
CREATE POLICY "Admin Full Portfolio" ON public.portfolio_items FOR ALL USING (auth.role() = 'authenticated');`;

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Database & Deployment Center</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Copy SQL migrations to set up your live Supabase project and export to GitHub Pages.</p>
          </div>

          <div className="bg-cream-white p-6 rounded-lg shadow-sm border border-sage-green/30 space-y-4">
            <h3 className="font-serif text-xl text-deep-teal">PostgreSQL Migration Script</h3>
            <pre className="bg-deep-teal text-cream-white/90 p-4 rounded text-[11px] font-mono overflow-x-auto leading-relaxed">
              {sqlSchema}
            </pre>
          </div>
        </div>
      );
    }

    // Render App safely with Error Boundary logic
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } catch(err) {
      console.error("ReactDOM Render Error:", err);
    }
  </script>
