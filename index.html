<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'Éternel Botanical | Luxury Floral Architecture</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'duck-teal': '#356B68',
            'deep-teal': '#193C3A',
            'cream-white': '#F7F5EF',
            'sage-green': '#A9BDB0',
            'dark-grey': '#393936',
            'soft-cream': '#EFECE6',
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'Georgia', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F7F5EF;
      color: #393936;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    /* Checkerboard pattern for showing PNG transparency */
    .bg-checkerboard {
      background-color: #ffffff;
      background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                        linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                        linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F5EF;
    }
    ::-webkit-scrollbar-thumb {
      background: #A9BDB0;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #356B68;
    }
  </style>
</head>
<body>

  <div id="root">
    <!-- Loading fallback display -->
    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center text-dark-grey bg-cream-white">
      <div className="w-12 h-12 border-4 border-duck-teal border-t-transparent rounded-full animate-spin mb-4"></div>
      <p className="font-serif text-xl text-deep-teal">Loading L'Éternel Botanical Portfolio...</p>
      <p className="text-xs text-dark-grey/60 mt-1">Initialising Haute Couture Floral System</p>
    </div>
  </div>

  <script type="text/babel">
    // Global Error Handler
    window.addEventListener('error', function(e) {
      console.error("Global React Error Caught:", e.error || e.message);
    });

    const { useState, useEffect, useMemo, useRef } = React;

    // Supabase Client Helper
    let supabaseClient = null;
    function getSupabaseClient(url, key) {
      if (url && key && window.supabase) {
        try {
          if (!supabaseClient) {
            supabaseClient = window.supabase.createClient(url, key);
          }
          return supabaseClient;
        } catch(e) {
          console.error("Supabase Init Error:", e);
        }
      }
      return null;
    }

    // --- INITIAL DATA SEEDING ---
    const INITIAL_CATEGORIES = [
      { id: 'cat-1', name: 'Hand Bouquet', slug: 'hand-bouquet', description: 'Curated artisanal hand-tied bouquets', display_order: 1, is_active: true },
      { id: 'cat-2', name: 'Bridal Bouquet', slug: 'bridal-bouquet', description: 'Ethereal bridal florals for everlasting memories', display_order: 2, is_active: true },
      { id: 'cat-3', name: 'Vase Arrangement', slug: 'vase-arrangement', description: 'Architectural sculptural florals in ceramic and glass', display_order: 3, is_active: true },
      { id: 'cat-4', name: 'Flower Box', slug: 'flower-box', description: 'Luxurious gift boxes filled with fresh blossoms', display_order: 4, is_active: true },
      { id: 'cat-5', name: 'Preserved Flowers', slug: 'preserved-flowers', description: 'Everlasting botanicals treated for perennial grace', display_order: 5, is_active: true },
      { id: 'cat-6', name: 'Event Decoration', slug: 'event-decoration', description: 'Grand scale bespoke botanical installations', display_order: 6, is_active: true }
    ];

    const INITIAL_PORTFOLIO = [
      {
        id: 'pf-1',
        category_id: 'cat-1',
        title: 'Eternal Grace',
        slug: 'eternal-grace',
        price: 288,
        show_price: true,
        flower_types: ['Cappuccino Rose', 'Eustoma', 'Ranunculus', 'Eucalyptus'],
        floral_message: 'A quiet tribute to timeless love, sculpted in warm nude hues and soft greenery.',
        description: 'Designed with imported Ecuadorian cappuccino roses, fluttery ranunculus, and wispy eucalyptus. Perfect for anniversaries and grand romance.',
        is_featured: true,
        featured_order: 1,
        display_order: 1,
        publication_status: 'published',
        main_image: 'https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=1000&q=80',
        processed_image: 'https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=1000&q=80',
        created_at: '2026-01-10T10:00:00Z'
      },
      {
        id: 'pf-2',
        category_id: 'cat-2',
        title: 'Serenade of Dawn',
        slug: 'serenade-of-dawn',
        price: 450,
        show_price: true,
        flower_types: ['White O’Hara Rose', 'Gardenia', 'Astilbe', 'Olive Foliage'],
        floral_message: 'Purity and poetic beginnings woven into an effortless organic silhouette.',
        description: 'An organic bridal bouquet boasting fragrant garden roses, featherlight astilbe, and silvery olive branches.',
        is_featured: true,
        featured_order: 2,
        display_order: 1,
        publication_status: 'published',
        main_image: 'https://images.unsplash.com/photo-1535241749838-299277b6305f?auto=format&fit=crop&w=1000&q=80',
        processed_image: 'https://images.unsplash.com/photo-1535241749838-299277b6305f?auto=format&fit=crop&w=1000&q=80',
        created_at: '2026-01-12T14:30:00Z'
      },
      {
        id: 'pf-3',
        category_id: 'cat-3',
        title: 'Emerald Dynasty',
        slug: 'emerald-dynasty',
        price: 380,
        show_price: true,
        flower_types: ['Anthurium', 'Cymbidium Orchid', 'Monstera', 'Protea'],
        floral_message: 'Bold architectural forms that bring sanctuary and dignity into modern spaces.',
        description: 'Set in an artisan handcrafted stoneware vase, featuring high-contrast tropical blooms and emerald foliage.',
        is_featured: true,
        featured_order: 3,
        display_order: 1,
        publication_status: 'published',
        main_image: 'https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?auto=format&fit=crop&w=1000&q=80',
        processed_image: 'https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?auto=format&fit=crop&w=1000&q=80',
        created_at: '2026-01-15T09:15:00Z'
      },
      {
        id: 'pf-4',
        category_id: 'cat-4',
        title: 'Velvet Noir Box',
        slug: 'velvet-noir-box',
        price: 320,
        show_price: true,
        flower_types: ['Black Baccara Rose', 'Dark Carnation', 'Hypericum Berries'],
        floral_message: 'Deep romance wrapped in shadows and opulent textures.',
        description: 'Presented in a signature matte teal box lined with silk tissue paper. Includes custom calligraphy card.',
        is_featured: false,
        featured_order: 4,
        display_order: 1,
        publication_status: 'published',
        main_image: 'https://images.unsplash.com/photo-1563241527-3004b7be0ffd?auto=format&fit=crop&w=1000&q=80',
        processed_image: 'https://images.unsplash.com/photo-1563241527-3004b7be0ffd?auto=format&fit=crop&w=1000&q=80',
        created_at: '2026-01-18T16:20:00Z'
      }
    ];

    const INITIAL_SETTINGS = {
      brand_name: "L'ÉTERNEL BOTANICAL",
      brand_tagline: "Floral Architecture & Botanical Art",
      hero_title: "Poetic Floral Design for Unforgettable Moments",
      hero_subtitle: "Bespoke botanical creations, sculptural arrangements, and luxury floral styling tailored for fine living.",
      hero_image: "https://images.unsplash.com/photo-1508615039623-a25605d2b022?auto=format&fit=crop&w=1800&q=80",
      about_story: "Founded by lead floral architect Clara Vance, L'Éternel Botanical approaches floral design through the lens of modern art, seasonal texture, and tactile elegance. Every stem is thoughtfully selected and intentionally placed to convey quiet luxury.",
      whatsapp_number: "60123456789",
      whatsapp_default_message: "Hi! I am captivated by your floral portfolio and would like to inquire about bespoke arrangements.",
      contact_email: "concierge@leternelbotanical.com",
      instagram_handle: "@leternel.botanical",
      primary_color: "#356B68",
      secondary_color: "#193C3A",
      background_color: "#F7F5EF",
      supabase_url: "",
      supabase_anon_key: "",
      show_hero: true,
      show_categories: true,
      show_featured: true,
      show_about: true,
      show_contact: true
    };

    // --- ICON COMPONENT ---
    const Icon = ({ name, className = "w-5 h-5", onClick }) => {
      const icons = {
        flower: <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V3m0 9a4.5 4.5 0 1 1-4.5-4.5M12 12a4.5 4.5 0 1 0 4.5 4.5M12 12v9m-4.5-4.5a4.5 4.5 0 1 1 4.5-4.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>,
        chevronRight: <path d="M9 18l6-6-6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        chevronDown: <path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        arrowUp: <path d="M12 19V5m-7 7l7-7 7 7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        arrowDown: <path d="M12 5v14m7-7l-7 7-7-7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        plus: <path d="M12 5v14m-7-7h14" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        edit: <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        trash: <path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        sparkles: <path d="M12 3v3m0 12v3m9-9h-3M6 12H3m15.364-6.364l-2.121 2.121M6.757 17.243l-2.121 2.121m12.728 0l-2.121-2.121M6.757 6.757L4.636 4.636" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        check: <path d="M20 6L9 17l-5-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        x: <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5l5-5 5 5m-5-5v12" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>,
        whatsapp: <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414-.074-.124-.272-.198-.57-.347z M12 2a10 10 0 0 0-8.52 15.26L2 22l4.87-1.42A10 10 0 1 0 12 2z" fill="currentColor"/>,
        layout: <path d="M3 3h18v18H3z M3 9h18 M9 21V9" stroke="currentColor" strokeWidth="2" fill="none"/>,
        settings: <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" strokeWidth="2" fill="none"/>,
        lock: <path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zm-11 0V7a4 4 0 0 1 8 0v4" stroke="currentColor" strokeWidth="2" fill="none"/>,
        database: <path d="M12 2C6.5 2 2 3.8 2 6v12c0 2.2 4.5 4 10 4s10-1.8 10-4V6c0-2.2-4.5-4-10-4z M2 12c0 2.2 4.5 4 10 4s10-1.8 10-4 M2 6c0 2.2 4.5 4 10 4s10-1.8 10-4" stroke="currentColor" strokeWidth="2" fill="none"/>,
        eye: <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="currentColor" strokeWidth="2" fill="none"/>,
        search: (
          <g>
            <circle cx="11" cy="11" r="8" stroke="currentColor" strokeWidth="2" fill="none"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" strokeWidth="2"/>
          </g>
        ),
        filter: <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" stroke="currentColor" strokeWidth="2" fill="none"/>
      };

      return (
        <svg viewBox="0 0 24 24" className={className} onClick={onClick} fill="none">
          {icons[name] || <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="2"/>}
        </svg>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [categories, setCategories] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_categories');
          return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
        } catch(e) {
          return INITIAL_CATEGORIES;
        }
      });

      const [portfolio, setPortfolio] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_portfolio');
          return saved ? JSON.parse(saved) : INITIAL_PORTFOLIO;
        } catch(e) {
          return INITIAL_PORTFOLIO;
        }
      });

      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_settings');
          return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
        } catch(e) {
          return INITIAL_SETTINGS;
        }
      });

      const [adminCreds, setAdminCreds] = useState(() => {
        try {
          const saved = localStorage.getItem('floral_admin_creds');
          return saved ? JSON.parse(saved) : { username: 'admin@leternelbotanical.com', password: 'admin123' };
        } catch(e) {
          return { username: 'admin@leternelbotanical.com', password: 'admin123' };
        }
      });

      const [viewMode, setViewMode] = useState('public');
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [activeAdminTab, setActiveAdminTab] = useState('dashboard');
      const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('all');
      const [selectedArrangement, setSelectedArrangement] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [isCloudSynced, setIsCloudSynced] = useState(false);
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => {
        localStorage.setItem('floral_admin_creds', JSON.stringify(adminCreds));
      }, [adminCreds]);

      useEffect(() => {
        const client = getSupabaseClient(settings.supabase_url, settings.supabase_anon_key);
        if (client) {
          setIsCloudSynced(true);
          client.from('website_settings').select('*').single().then(({ data, error }) => {
            if (data && !error) setSettings(prev => ({ ...prev, ...data }));
          });
          client.from('categories').select('*').order('display_order', { ascending: true }).then(({ data, error }) => {
            if (data && data.length > 0 && !error) setCategories(data);
          });
          client.from('portfolio_items').select('*').order('display_order', { ascending: true }).then(({ data, error }) => {
            if (data && data.length > 0 && !error) setPortfolio(data);
          });
        } else {
          setIsCloudSynced(false);
        }
      }, [settings.supabase_url, settings.supabase_anon_key]);

      useEffect(() => {
        localStorage.setItem('floral_categories', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('floral_portfolio', JSON.stringify(portfolio));
      }, [portfolio]);

      useEffect(() => {
        localStorage.setItem('floral_settings', JSON.stringify(settings));
        const client = getSupabaseClient(settings.supabase_url, settings.supabase_anon_key);
        if (client) {
          client.from('website_settings').upsert({ id: 1, ...settings }).then(({ error }) => {
            if (error) console.log("Supabase Sync Note:", error.message);
          });
        }
      }, [settings]);

      const publishedPortfolio = useMemo(() => {
        return portfolio.filter(item => item.publication_status === 'published');
      }, [portfolio]);

      const filteredPortfolio = useMemo(() => {
        return publishedPortfolio.filter(item => {
          const matchesCategory = selectedCategoryFilter === 'all' || item.category_id === selectedCategoryFilter;
          const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                item.flower_types.some(f => f.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchesCategory && matchesSearch;
        }).sort((a, b) => a.display_order - b.display_order);
      }, [publishedPortfolio, selectedCategoryFilter, searchQuery]);

      const featuredPortfolio = useMemo(() => {
        return publishedPortfolio
          .filter(item => item.is_featured)
          .sort((a, b) => (a.featured_order || 99) - (b.featured_order || 99));
      }, [publishedPortfolio]);

      return (
        <div className="min-h-screen flex flex-col selection:bg-duck-teal selection:text-white">
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-md shadow-2xl flex items-center space-x-3 transition-all duration-300 ${toast.type === 'error' ? 'bg-red-900 text-white' : 'bg-deep-teal text-cream-white border border-duck-teal'}`}>
              <Icon name={toast.type === 'error' ? 'x' : 'check'} className="w-5 h-5 text-sage-green" />
              <span className="text-sm font-medium tracking-wide">{toast.message}</span>
            </div>
          )}

          {viewMode === 'public' ? (
            <PublicWebsite 
              settings={settings}
              categories={categories.filter(c => c.is_active).sort((a,b) => a.display_order - b.display_order)}
              portfolio={filteredPortfolio}
              featuredPortfolio={featuredPortfolio}
              selectedCategoryFilter={selectedCategoryFilter}
              setSelectedCategoryFilter={setSelectedCategoryFilter}
              searchQuery={searchQuery}
              setSearchQuery={setSearchQuery}
              onSelectArrangement={setSelectedArrangement}
              onOpenAdmin={() => setViewMode('admin')}
              isCloudSynced={isCloudSynced}
            />
          ) : (
            <AdminDashboard 
              isAuthenticated={isAdminAuthenticated}
              setIsAuthenticated={setIsAdminAuthenticated}
              activeTab={activeAdminTab}
              setActiveTab={setActiveAdminTab}
              categories={categories}
              setCategories={setCategories}
              portfolio={portfolio}
              setPortfolio={setPortfolio}
              settings={settings}
              setSettings={setSettings}
              adminCreds={adminCreds}
              setAdminCreds={setAdminCreds}
              onReturnToPublic={() => setViewMode('public')}
              showToast={showToast}
              isCloudSynced={isCloudSynced}
            />
          )}

          {selectedArrangement && (
            <ArrangementDetailModal 
              item={selectedArrangement} 
              categoryName={categories.find(c => c.id === selectedArrangement.category_id)?.name || 'Collection'}
              settings={settings}
              onClose={() => setSelectedArrangement(null)} 
            />
          )}

          {viewMode === 'public' && (
            <a 
              href={`https://wa.me/${settings.whatsapp_number}?text=${encodeURIComponent(settings.whatsapp_default_message)}`}
              target="_blank" 
              rel="noopener noreferrer"
              className="fixed bottom-6 right-6 z-40 bg-duck-teal hover:bg-deep-teal text-white p-4 rounded-full shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center border border-sage-green/30 group"
              title="Chat on WhatsApp"

    // --- ADMIN SUB-TAB 3: CATEGORY MANAGER ---
    function AdminCategoryManager({ categories, setCategories, showToast }) {
      const [newCategoryName, setNewCategoryName] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newCategoryName.trim()) return;
        const newCat = {
          id: 'cat-' + Date.now(),
          name: newCategoryName.trim(),
          slug: newCategoryName.toLowerCase().replace(/\s+/g, '-'),
          description: 'Custom botanical section',
          display_order: categories.length + 1,
          is_active: true
        };
        setCategories(prev => [...prev, newCat]);
        setNewCategoryName('');
        showToast('New category added!');
      };

      const handleMove = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= categories.length) return;
        const updated = [...categories];
        const temp = updated[index];
        updated[index] = updated[targetIndex];
        updated[targetIndex] = temp;
        
        // Re-assign order numbers
        const reordered = updated.map((c, i) => ({ ...c, display_order: i + 1 }));
        setCategories(reordered);
        showToast('Category sequence updated!');
      };

      const handleDelete = (id) => {
        if (confirm('Delete this category?')) {
          setCategories(prev => prev.filter(c => c.id !== id));
          showToast('Category removed.', 'error');
        }
      };

      return (
        <div className="space-y-6 max-w-3xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Category Management</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Add, rename, or re-order portfolio collections.</p>
          </div>

          <form onSubmit={handleAdd} className="bg-cream-white p-4 rounded-lg border border-sage-green/30 flex gap-3">
            <input 
              type="text" 
              placeholder="New Category Name (e.g. Centerpiece)" 
              value={newCategoryName}
              onChange={e => setNewCategoryName(e.target.value)}
              className="flex-1 bg-soft-cream border border-sage-green/40 px-4 py-2 rounded text-xs focus:outline-none focus:border-duck-teal"
            />
            <button type="submit" className="px-5 py-2 bg-duck-teal text-cream-white text-xs font-semibold uppercase tracking-wider rounded">
              Add
            </button>
          </form>

          <div className="bg-cream-white rounded-lg border border-sage-green/30 shadow-sm divide-y divide-sage-green/20">
            {categories.map((cat, idx) => (
              <div key={cat.id} className="p-4 flex items-center justify-between text-xs">
                <div>
                  <span className="font-serif text-lg text-deep-teal font-medium block">{cat.name}</span>
                  <span className="text-[10px] text-dark-grey/60 font-mono">Slug: /{cat.slug}</span>
                </div>
                <div className="flex items-center space-x-2">
                  <button onClick={() => handleMove(idx, -1)} disabled={idx === 0} className="p-1.5 border rounded hover:bg-soft-cream disabled:opacity-30">
                    <Icon name="arrowUp" className="w-3.5 h-3.5" />
                  </button>
                  <button onClick={() => handleMove(idx, 1)} disabled={idx === categories.length - 1} className="p-1.5 border rounded hover:bg-soft-cream disabled:opacity-30">
                    <Icon name="arrowDown" className="w-3.5 h-3.5" />
                  </button>
                  <button onClick={() => handleDelete(cat.id)} className="p-1.5 text-red-600 hover:bg-red-50 rounded">
                    <Icon name="trash" className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 4: PORTFOLIO ITEM SORTING ---
    function AdminSortingManager({ categories, portfolio, setPortfolio, showToast }) {
      const [selectedCat, setSelectedCat] = useState(categories[0]?.id || '');

      const catItems = useMemo(() => {
        return portfolio.filter(i => i.category_id === selectedCat).sort((a,b) => a.display_order - b.display_order);
      }, [portfolio, selectedCat]);

      const handleMove = (index, direction) => {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= catItems.length) return;
        const itemsCopy = [...catItems];
        const temp = itemsCopy[index];
        itemsCopy[index] = itemsCopy[targetIndex];
        itemsCopy[targetIndex] = temp;

        const updatedMap = new Map(itemsCopy.map((item, i) => [item.id, i + 1]));

        setPortfolio(prev => prev.map(item => {
          if (updatedMap.has(item.id)) {
            return { ...item, display_order: updatedMap.get(item.id) };
          }
          return item;
        }));
        showToast('Arrangement sorting order saved!');
      };

      return (
        <div className="space-y-6 max-w-3xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Arrangement Sorting</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Re-order how arrangements appear within a category.</p>
          </div>

          <div className="bg-cream-white p-4 rounded-lg border border-sage-green/30">
            <label className="block text-xs font-semibold uppercase text-duck-teal mb-2">Select Category to Sort</label>
            <select 
              value={selectedCat} 
              onChange={e => setSelectedCat(e.target.value)}
              className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs"
            >
              {categories.map(c => (
                <option key={c.id} value={c.id}>{c.name}</option>
              ))}
            </select>
          </div>

          <div className="bg-cream-white rounded-lg border border-sage-green/30 shadow-sm divide-y divide-sage-green/20">
            {catItems.length === 0 ? (
              <p className="p-6 text-xs text-center text-dark-grey/60">No arrangements in this category yet.</p>
            ) : (
              catItems.map((item, idx) => (
                <div key={item.id} className="p-4 flex items-center justify-between text-xs">
                  <div className="flex items-center space-x-3">
                    <span className="font-mono text-xs text-duck-teal font-bold w-6">#{idx + 1}</span>
                    <img src={item.processed_image || item.main_image} className="w-10 h-10 object-cover rounded bg-checkerboard" />
                    <span className="font-serif text-base text-deep-teal">{item.title}</span>
                  </div>
                  <div className="flex space-x-2">
                    <button onClick={() => handleMove(idx, -1)} disabled={idx === 0} className="p-1.5 border rounded hover:bg-soft-cream disabled:opacity-30">
                      <Icon name="arrowUp" className="w-4 h-4" />
                    </button>
                    <button onClick={() => handleMove(idx, 1)} disabled={idx === catItems.length - 1} className="p-1.5 border rounded hover:bg-soft-cream disabled:opacity-30">
                      <Icon name="arrowDown" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

              <div key={item.id} className="p-4 flex items-center justify-between text-xs">
                <div className="flex items-center space-x-4">
                  <div className="w-14 h-14 bg-checkerboard rounded overflow-hidden shadow-inner border border-sage-green/30">
                    <img src={item.processed_image || item.main_image} className="w-full h-full object-contain" />
                  </div>
                  <div>
                    <span className="font-serif text-lg text-deep-teal block">{item.title}</span>
                    <span className="text-[10px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-mono">
                      {item.processed_image ? '● Transparent PNG Ready' : '○ Original Image'}
                    </span>
                  </div>
                </div>

                <button 
                  onClick={() => triggerAIBackgroundRemoval(item)}
                  disabled={processingId === item.id}
                  className="px-4 py-2.5 bg-duck-teal text-cream-white rounded hover:bg-deep-teal transition-colors text-xs font-semibold uppercase tracking-wider flex items-center space-x-2 disabled:opacity-50"
                >
                  <Icon name="sparkles" className="w-4 h-4 text-sage-green" />
                  <span>{processingId === item.id ? 'Processing...' : 'Run AI Processing'}</span>
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 7: WEBSITE APPEARANCE SETTINGS ---

            <p className="text-xs text-dark-grey/70 mt-1">Customize brand information, cloud storage, and hero banner settings.</p>
          </div>

          <form onSubmit={handleSave} className="bg-cream-white p-6 rounded-lg border border-sage-green/30 shadow-sm space-y-6 text-xs">
            <div className="p-4 bg-soft-cream rounded-md border-l-4 border-duck-teal space-y-2">
              <span className="font-semibold uppercase tracking-wider text-duck-teal block">Cloud Database Configuration (Supabase)</span>
              <p className="text-[11px] text-dark-grey/80">Configure Supabase project details to enable real-time cloud multi-device sync.</p>
              
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                <div>
                  <label className="block font-semibold mb-1">Supabase Project URL</label>
                  <input 
                    type="text"

                    className="w-full bg-cream-white border border-sage-green/40 p-2 rounded text-xs font-mono"
                  />
                </div>
                <div>
                  <label className="block font-semibold mb-1">Supabase Anon Public Key</label>
                  <input 
                    type="password" 
                    placeholder="eyJhbGciOi..." 
                    value={formData.supabase_anon_key} 
                    onChange={e => setFormData({...formData, supabase_anon_key: e.target.value})} 
                    className="w-full bg-cream-white border border-sage-green/40 p-2 rounded text-xs font-mono"
                  />
                </div>
              </div>
            </div>

            <div className="space-y-4">
              <h3 className="font-serif text-xl text-deep-teal border-b border-sage-green/20 pb-2">Brand Info</h3>
              
              <div>
                <label className="block font-semibold uppercase mb-1">Brand Name</label>
                <input 
                  type="text" required

            <div className="space-y-4">
              <h3 className="font-serif text-xl text-deep-teal border-b border-sage-green/20 pb-2">Hero Section</h3>

              <div>
                <label className="block font-semibold uppercase mb-1">Hero Title</label>

                  type="text"

              <div>
                <label className="block font-semibold uppercase mb-1">Hero Subtitle</label>

    // --- ADMIN SUB-TAB 8: ACCOUNT CREDENTIALS SETTINGS ---
    function AdminAccountSettings({ adminCreds, setAdminCreds, showToast }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newUsername, setNewUsername] = useState(adminCreds.username);
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');

      const handleUpdateCredentials = (e) => {
        e.preventDefault();
        
        if (currentPassword !== adminCreds.password) {
          showToast('Current password is incorrect.', 'error');
          return;
        }

        if (!newUsername.trim()) {
          showToast('Username/Email cannot be empty.', 'error');
          return;
        }

        if (newPassword && newPassword !== confirmPassword) {
          showToast('New passwords do not match.', 'error');
          return;
        }

        const updatedPassword = newPassword.trim() ? newPassword : adminCreds.password;

        setAdminCreds({
          username: newUsername.trim(),
          password: updatedPassword
        });

        setCurrentPassword('');
        setNewPassword('');
        setConfirmPassword('');
        showToast('Admin login credentials updated successfully!');
      };

      return (
        <div className="space-y-6 max-w-2xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Account Credentials</h1>
            <p className="text-xs text-dark-grey/70 mt-1">
              Update your administrator login username/email and password for securing the Control Center.
            </p>
          </div>

          <div className="bg-cream-white p-8 rounded-lg shadow-sm border border-sage-green/30 space-y-6 text-xs">
            <div className="p-4 bg-soft-cream/80 border-l-4 border-duck-teal rounded text-dark-grey text-xs">
              <p className="font-semibold text-deep-teal mb-1">Current Active Account</p>
              <p>Username / Email: <span className="font-mono text-duck-teal font-semibold">{adminCreds.username}</span></p>
            </div>

            <form onSubmit={handleUpdateCredentials} className="space-y-4">
              <div>
                <label className="block font-semibold uppercase text-dark-grey mb-1">Current Password (Required)</label>
                <input 
                  type="password" 
                  required
                  placeholder="Enter current password"
                  value={currentPassword} 
                  onChange={e => setCurrentPassword(e.target.value)} 
                  className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs focus:outline-none focus:border-duck-teal"
                />
              </div>

              <div className="pt-3 border-t border-sage-green/20">
                <label className="block font-semibold uppercase text-dark-grey mb-1">New Admin Username / Email</label>
                <input 
                  type="text" 
                  required
                  value={newUsername} 
                  onChange={e => setNewUsername(e.target.value)} 
                  className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs focus:outline-none focus:border-duck-teal"
                />
              </div>

              <div>
                <label className="block font-semibold uppercase text-dark-grey mb-1">New Password (Optional)</label>
                <input 
                  type="password" 
                  placeholder="Enter new password"
                  value={newPassword} 
                  onChange={e => setNewPassword(e.target.value)} 
                  className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs focus:outline-none focus:border-duck-teal"
                />
              </div>

              <div>
                <label className="block font-semibold uppercase text-dark-grey mb-1">Confirm New Password</label>
                <input 
                  type="password" 
                  placeholder="Re-enter new password"
                  value={confirmPassword} 
                  onChange={e => setConfirmPassword(e.target.value)} 
                  className="w-full bg-soft-cream border border-sage-green/40 p-2.5 rounded text-xs focus:outline-none focus:border-duck-teal"
                />
              </div>

              <div className="pt-4 flex justify-end">
                <button 
                  type="submit" 
                  className="px-6 py-3 bg-duck-teal hover:bg-deep-teal text-cream-white text-xs uppercase tracking-widest font-semibold rounded shadow-md transition-colors"
                >
                  Update Credentials
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- ADMIN SUB-TAB 9: DATABASE & GITHUB DEPLOYMENT ---
    function AdminDatabaseGuide() {
      const sqlSchema = `-- ==========================================
-- LUXURY FLORAL PORTFOLIO DATABASE SCHEMA
-- PostgreSQL / Supabase
-- ==========================================

-- Enable UUID extension
CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

-- 1. CATEGORIES TABLE
CREATE TABLE IF NOT EXISTS public.categories (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    name VARCHAR(255) NOT NULL,
    slug VARCHAR(255) NOT NULL UNIQUE,
    description TEXT,
    display_order INT DEFAULT 0,
    is_active BOOLEAN DEFAULT true,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- 2. PORTFOLIO ITEMS TABLE
CREATE TABLE IF NOT EXISTS public.portfolio_items (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    category_id UUID REFERENCES public.categories(id) ON DELETE SET NULL,
    title VARCHAR(255) NOT NULL,
    slug VARCHAR(255) NOT NULL UNIQUE,
    price DECIMAL(10,2) NOT NULL,
    show_price BOOLEAN DEFAULT true,
    flower_types TEXT[] DEFAULT '{}',
    floral_message TEXT,
    description TEXT,
    is_featured BOOLEAN DEFAULT false,
    featured_order INT DEFAULT 0,
    display_order INT DEFAULT 0,
    publication_status VARCHAR(50) DEFAULT 'published',
    main_image TEXT NOT NULL,
    processed_image TEXT,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
);

-- ROW LEVEL SECURITY (RLS) POLICIES
ALTER TABLE public.categories ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.portfolio_items ENABLE ROW LEVEL SECURITY;

-- Public Visitors: READ ONLY
CREATE POLICY "Public Read Categories" ON public.categories FOR SELECT USING (is_active = true);
CREATE POLICY "Public Read Portfolio" ON public.portfolio_items FOR SELECT USING (publication_status = 'published');

-- Authorized Admins: FULL ACCESS
CREATE POLICY "Admin Full Categories" ON public.categories FOR ALL USING (auth.role() = 'authenticated');
CREATE POLICY "Admin Full Portfolio" ON public.portfolio_items FOR ALL USING (auth.role() = 'authenticated');`;

      return (
        <div className="space-y-6 max-w-4xl">
          <div>
            <h1 className="font-serif text-3xl text-deep-teal">Database & Deployment Center</h1>
            <p className="text-xs text-dark-grey/70 mt-1">Copy SQL migrations to set up your live Supabase project and export to GitHub Pages.</p>
          </div>

          <div className="bg-cream-white p-6 rounded-lg shadow-sm border border-sage-green/30 space-y-4">
            <h3 className="font-serif text-xl text-deep-teal">PostgreSQL Migration Script</h3>
            <pre className="bg-deep-teal text-cream-white/90 p-4 rounded text-[11px] font-mono overflow-x-auto leading-relaxed">
              {sqlSchema}
            </pre>
          </div>
        </div>
      );
    }

    // Render App
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } catch(err) {
      console.error("ReactDOM Render Error:", err);
    }
  </script>
